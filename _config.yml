# Project page for Subliminal Watermarks. The org site: served by GitHub Pages from the root of
# subliminal-watermarks/subliminal-watermarks.github.io (Settings -> Pages -> Deploy from a branch -> main, /).

title: "[Method name TBD]"
description: "Detecting watermark distillation from a single student response."
url: "https://subliminal-watermarks.github.io"
baseurl: ""   # org site, served at the domain root
repo_url: "https://github.com/subliminal-watermarks/subliminal-watermarks.github.io"

# Build settings (same stack as chang-han-chen.github.io)
markdown: kramdown
kramdown:
  input: GFM
  math_engine: mathjax
  auto_ids: true
  toc_levels: 2..3   # margin table of contents: sections and subsections
highlighter: rouge
timezone: America/Los_Angeles

defaults:
  - scope:
      path: ""
    values:
      layout: article

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .bundle
  - .jekyll-cache
