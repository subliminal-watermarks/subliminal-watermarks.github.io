// DATA.nodes maps a generated path ("id,id,...") to the model's five likeliest next tokens [text, id, p] and the
// probability left over. In this demo the key chooses among those five (the real watermark ranges over the whole vocabulary).
const N_STEPS = 5, CONTEXT = 3;

function fnv(str) { let h = 2166136261 >>> 0; for (const ch of str) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619) >>> 0; } return h; }
function mulberry32(a) { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
const secretU = (key, ctx, tokenId) => Math.min(Math.max(mulberry32(fnv(key + '|' + ctx.join(',') + '|' + tokenId)), 1e-12), 1 - 1e-12);
const keyName = key => (key >>> 0).toString(16).toUpperCase().padStart(8, '0');

function generate(key) {
  const ids = DATA.prefix_ids.slice(), path = [], steps = [];
  for (let s = 0; s < N_STEPS; s++) {
    const node = DATA.nodes[path.join(',')], ctx = ids.slice(-CONTEXT);
    const rows = node.c.map(([t, id, p]) => { const u = secretU(key, ctx, id); return { t, id, p, u, log: Math.log(u) / p }; });
    let w = 0; rows.forEach((r, i) => { if (r.log > rows[w].log) w = i; });
    rows.forEach(r => r.score = Math.exp(r.log));
    steps.push({ rows, w, rest: node.r, ctx: ctx.map(i => DATA.vocab[i] ?? '?') });
    path.push(rows[w].id); ids.push(rows[w].id);
  }
  return steps;
}

// ---------- suggested keys: keys whose continuations start differently; the demo offers two of them ----------
function pickSuggested() {           // per first token, the most fluent of the first keys found (highest path probability)
  const byFirst = new Map();
  for (let i = 1; i < 4000; i++) {
    const k = fnv('suggested key ' + i), st = generate(k), first = st[0].rows[st[0].w].t;
    const logp = st.reduce((a, x) => a + Math.log(x.rows[x.w].p), 0), best = byFirst.get(first);
    if (!best || logp > best.logp) byFirst.set(first, { k, logp });
  }
  const order = DATA.nodes[''].c.map(c => c[0]).filter(t => byFirst.has(t));     // most likely first tokens first
  return order.slice(0, 4).map(t => byFirst.get(t).k);
}

// ---------- rendering ----------
const show = t => { const s = t.replace(/\n/g, '⏎').trim(); return s === '' ? '(space)' : s; };
const fmtP = p => p >= .995 ? (p * 100).toFixed(1) + '%' : p >= .1 ? Math.round(p * 100) + '%' : p >= .01 ? (p * 100).toFixed(1) + '%' : (p * 100).toFixed(2) + '%';
let steps = [], sel = 0;
function renderText() {
  const box = document.getElementById('text'); box.innerHTML = '';
  const [q, a] = DATA.prefix.split('\n');
  const l1 = document.createElement('div'); l1.className = 'q'; l1.textContent = q; box.appendChild(l1);
  const l2 = document.createElement('div'); const pre = document.createElement('span'); pre.className = 'pre'; pre.textContent = a; l2.appendChild(pre);
  steps.forEach((s, i) => {
    const t = s.rows[s.w].t, b = document.createElement('button');
    b.className = 'gen' + (/^\s/.test(t) ? ' sp' : ''); b.textContent = show(t);
    b.setAttribute('aria-pressed', i === sel ? 'true' : 'false'); b.setAttribute('aria-label', `generated token ${i + 1}: ${show(t)}`);
    b.onclick = () => { sel = i; renderText(); renderDetail(); };
    l2.appendChild(b);
  });
  box.appendChild(l2);
}
function renderDetail() {
  const s = steps[sel], win = s.rows[s.w];
  const g = document.getElementById('grid');
  g.innerHTML = `<div class="h">candidate</div><div class="h">model’s probability p</div><div class="h" style="text-align:center">secret u</div><div class="h">score u<sup>1/p</sup></div>`;
  s.rows.forEach((r, i) => {
    const w = i === s.w ? ' win' : '';
    g.insertAdjacentHTML('beforeend',
      `<div class="tok${w}">${show(r.t)}</div>` +
      `<div class="barcell"><div class="track"><div class="fill" style="width:${Math.max(r.p * 100, .6)}%"></div></div><span class="num">${fmtP(r.p)}</span></div>` +
      `<div class="u${w}">${r.u.toFixed(2)}</div>` +
      `<div class="barcell${w}"><div class="track"><div class="fill score" style="width:${(r.score * 100).toFixed(1)}%"></div></div><span class="num">${r.score.toFixed(2)}</span></div>`);
  });
  postHeight();
}
let curName = '';
function useKey(key, btn) {
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-pressed', b === btn ? 'true' : 'false'));
  curName = keyName(key); document.getElementById('keyname').textContent = 'key ' + curName;
  steps = generate(key); renderText(); renderDetail();
}

const suggested = pickSuggested().slice(2, 4), holder = document.getElementById('suggested');   // the 3rd and 4th: the key overrides the model's top choice more often
suggested.forEach((k, i) => { const b = document.createElement('button'); b.textContent = 'Key ' + 'AB'[i];
  b.onclick = () => useKey(k, b); holder.appendChild(b); });
document.getElementById('random').onclick = e => useKey((Math.random() * 4294967296) >>> 0, e.currentTarget);

function postHeight() {   // the content's own height, so the frame can shrink as well as grow
  const h = Math.ceil(document.querySelector('.wrap').getBoundingClientRect().height) + 4;
  try { parent.postMessage({ type: 'anim-height', h }, '*'); } catch (e) {} }
addEventListener('load', postHeight); addEventListener('resize', postHeight); setTimeout(postHeight, 300);
window.__test = { generate, suggested, DATA };
useKey(suggested[0], holder.firstChild);
</script>
