  wmCard.querySelector('.badge').textContent = 'Watermarked'; clCard.querySelector('.badge').textContent = 'Clean';
  A.querySelector('.name').textContent = 'ANSWER A'; B.querySelector('.name').textContent = 'ANSWER B';
  cur = { wmCard, detRight: p.llr_w > p.llr_c };                         // the detector picks the answer with the higher LLR score
  revealed = false; wrap.className = 'wrap'; btn.hidden = true;
  status.innerHTML = `<b>Pair ${round + 1} of ${ROUNDS}.</b> ${p.question}`;
  msg.textContent = 'Click the answer you think is watermarked.';
  setTally(); postHeight();
}
function pick(card) {
  if (revealed || wrap.className !== 'wrap') return;   // only during a round, before the reveal
  revealed = true; const right = card === cur.wmCard;
  you += right; det += cur.detRight;
  card.querySelector('.name').textContent += ' · YOUR PICK';
  wrap.classList.add('revealed');
  msg.innerHTML = `${right ? '<b>You got it.</b>' : '<b>Not this time.</b>'} ${cur.detRight ? 'The detector got it.' : 'The detector missed it.'}`;
  setTally();
  btn.textContent = round + 1 < ROUNDS ? 'Next pair' : 'See scores'; btn.hidden = false; btn.focus({ preventScroll: true }); postHeight();
}
function finish() {
  const h = $('cards').getBoundingClientRect().height; $('result').style.minHeight = (innerWidth < 620 ? Math.min(h, 260) : h) + 'px';
  $('youNum').innerHTML = `${you}<small> / ${ROUNDS}</small>`; $('detNum').innerHTML = `${det}<small> / ${ROUNDS}</small>`;
  wrap.className = 'wrap done'; status.innerHTML = '<b>Final scores</b>'; tally.innerHTML = ''; msg.textContent = '';
  btn.textContent = 'Play again'; postHeight();
}
btn.onclick = () => {
  if (wrap.classList.contains('intro')) { show(); return; }
  if (wrap.classList.contains('done')) { game++; round = 0; you = 0; det = 0; show(); return; }
  if (round + 1 < ROUNDS) { round++; show(); } else finish();
};
[A, B].forEach(c => { c.onclick = () => pick(c); c.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(c); } }; });

function postHeight() {
  const h = Math.ceil(wrap.getBoundingClientRect().height) + 4;
  try { parent.postMessage({ type: 'anim-height', h }, '*'); } catch (e) {} }
addEventListener('load', postHeight); addEventListener('resize', postHeight); setTimeout(postHeight, 300);
window.__test = { show, pick, finish, DATA, order, sides, A, B, btn, get state() { return { game, round, you, det, revealed }; } };
show();
const h0 = (() => { wrap.className = 'wrap'; const h = $('cards').getBoundingClientRect().height; return innerWidth < 620 ? Math.min(h, 260) : h; })();
$('start').style.minHeight = h0 + 'px'; wrap.className = 'wrap intro'; status.innerHTML = ''; tally.innerHTML = ''; msg.textContent = '';
btn.textContent = 'Start'; btn.hidden = false; postHeight();
</script>
