<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Likelihood Line</title>
<meta name="description" content="The watermark detector as a likelihood change along one line in weight space: the slope of each answer's log-likelihood at the clean teacher, in the direction of the watermarked teacher. Fully measured.">
<style>
/* Layout: a black 16:9 stage; one 2D plot (parameter line × log-likelihood) drawn on canvas in the Manim idiom, titles above, caption below. */
:root {
  /* palette and type of the fingerprint-sft blog: white stage, #1477AC watermarked, #888 clean, red accent, system-ui */
  --bg: #ffffff; --ink: #2b2d31; --muted: #6a737d; --grid: #eceef1; --axis: #c9cdd3;
  --blue: #1477ac; --pink: #d1453b; --grey: #888888; --white: #2b2d31;
  --font-body: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { background: #ffffff; color: var(--ink); }
body { font-family: var(--font-body); margin: 0; }
.wrap { max-width: 960px; margin: 0 auto; padding: 4px 8px 6px; display: grid; gap: 10px; }
.stage { position: relative; width: 100%; aspect-ratio: 16 / 9; container-type: inline-size; background: var(--bg); overflow: hidden; cursor: pointer; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.overlay { position: absolute; inset: 0; pointer-events: none; display: grid; grid-template-rows: auto 1fr auto; padding: 2.6cqw 4cqw 2.4cqw; }
.t { font-weight: 600; font-size: 2.9cqw; line-height: 1.15; text-align: center; margin: 0; text-wrap: balance; color: var(--white); }
.sub { font-size: 1.6cqw; color: var(--muted); text-align: center; margin: .4cqw 0 0; }
.cap { font-size: 1.75cqw; text-align: center; line-height: 1.45; margin: 0; color: var(--ink); }
.b { color: var(--blue); } .p { color: var(--pink); } .g { color: var(--grey); }
.counts { font-family: var(--font-mono); font-size: 1.45cqw; color: var(--muted); text-align: center; margin: .6cqw 0 0; min-height: 1.9cqw; font-variant-numeric: tabular-nums; }
.counts b { font-weight: 600; }
.tag { position: absolute; transform: translate(-50%, -50%); font-size: 1.6cqw; white-space: nowrap; pointer-events: none; color: var(--white); transition: opacity .45s; text-shadow: 0 0 .6cqw var(--bg), 0 0 1cqw var(--bg); }
.tag.b { color: var(--blue); } .tag.p { color: var(--pink); } .tag.g { color: var(--grey); } .tag.mu { color: var(--muted); font-size: 1.35cqw; }
.tag.right { transform: translate(-100%, -50%); } .tag.left { transform: translate(0, -50%); }
.tag .n { font-family: var(--font-mono); font-size: 1.35cqw; }
svg.tex { display: inline-block; fill: currentColor; stroke: currentColor; overflow: visible; }
.bar { height: 3px; background: #e3e5e8; border-radius: 2px; overflow: hidden; } .bar i { display: block; height: 100%; width: 0; background: var(--blue); }
.ctl { display: flex; justify-content: flex-end; margin-top: -6px; }
.replay { font: inherit; font-size: 14px; border: none; background: none; color: var(--muted); cursor: pointer; padding: 4px 8px; } .replay:hover { color: var(--ink); } .replay:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.foot { font-size: 13px; color: #6a737d; max-width: 88ch; margin: 0; line-height: 1.5; } .foot b { color: #2b2d31; font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <div class="stage" id="stage" aria-label="2D explainer animation">
    <canvas id="cv"></canvas>
    <div class="overlay">
      <div><h1 class="t" id="title"></h1><p class="sub" id="sub"></p></div>
      <div></div>
      <div><p class="cap" id="cap"></p><p class="counts" id="counts"></p></div>
    </div>
  </div>
  <div class="bar"><i id="prog"></i></div>
  <div class="ctl"><button class="replay" id="replay" type="button">↻ Replay</button></div>
</div>

function glowDot(x, y, r, color, alpha) { const g = ctx.createRadialGradient(x, y, 0, x, y, r * 2.6); g.addColorStop(0, color); g.addColorStop(0.35, color); g.addColorStop(1, 'rgba(255,255,255,0)'); ctx.globalAlpha = alpha * 0.22; ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 2.6, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = alpha; ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1; }
function arrowHead(x0, y0, x1, y1, size, color) { const a = Math.atan2(y1 - y0, x1 - x0); ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x1 - size * Math.cos(a - 0.45), y1 - size * Math.sin(a - 0.45)); ctx.lineTo(x1 - size * Math.cos(a + 0.45), y1 - size * Math.sin(a + 0.45)); ctx.closePath(); ctx.fill(); }

function drawCurve(c, eEnd, color, alpha, width) { if (eEnd <= XMIN) return; ctx.strokeStyle = color; ctx.globalAlpha = alpha; ctx.lineWidth = width; ctx.beginPath(); const n = 80; for (let i = 0; i <= n; i++) { const e = XMIN + (eEnd - XMIN) * i / n; const x = sx(e), y = sy(at(c, e)); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } ctx.stroke(); ctx.globalAlpha = 1; }
function line(x0, y0, x1, y1, color, alpha, width, dash) { ctx.strokeStyle = color; ctx.globalAlpha = alpha; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1; }

function frame(now) {
  T = paused ? pausedAt : (now - t0) / 1000; if (reduceMotion) T = PH[5] + 8; T = T % TOTAL;
  phase = T >= PH[6] ? 6 : T >= PH[5] ? 5 : T >= PH[4] ? 4 : T >= PH[3] ? 3 : T >= PH[2] ? 2 : T >= PH[1] ? 1 : 0; setText(phase);
  const b = box(); ctx.clearRect(0, 0, W, H); ctx.fillStyle = COL.bg; ctx.fillRect(0, 0, W, H);
  const axesU = ease(prog(T, PH[1] + 0.2, PH[1] + 1.4));
  const pro = 1 - ease(prog(T, PH[1], PH[1] + 1.5));                 // prologue objects fade once the line takes over
  // grid + axes (x: eps; y: change in log p per token)
  ctx.lineWidth = 1; ctx.strokeStyle = COL.grid; ctx.globalAlpha = axesU * 0.9;
  for (let e = XMIN; e <= XMAX + 1e-9; e += 0.25) { ctx.beginPath(); ctx.moveTo(sx(e), b.top); ctx.lineTo(sx(e), b.bottom); ctx.stroke(); }
  for (let v = YMIN; v <= YMAX + 1e-9; v += 0.02) { ctx.beginPath(); ctx.moveTo(b.left, sy(v)); ctx.lineTo(b.right, sy(v)); ctx.stroke(); }
  ctx.globalAlpha = 1;
  // the parameter line itself (y = 0) is always there from the prologue on; the y axis arrives with the plot
  const lineU = ease(prog(T, 4.0, 4.9));
  line(sx(0) - (sx(0) - b.left) * axesU, sy(0), sx(0) + (sx(1) - sx(0)) * lineU + (b.right - sx(1)) * axesU, sy(0), COL.axis, 1, 1.5);
  line(sx(0), sy(0), sx(0), sy(0) - (sy(0) - b.top) * axesU, COL.axis, 1, 1.5); line(sx(0), sy(0), sx(0), sy(0) + (b.bottom - sy(0)) * axesU, COL.axis, 1, 1.5);
  // tick labels
  ctx.globalAlpha = axesU; ctx.fillStyle = COL.muted; ctx.font = `${Math.max(10, W * 0.013)}px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace`; ctx.textAlign = 'center';
  for (let e = XMIN; e <= XMAX + 1e-9; e += 0.5) { if (Math.abs(e) < 1e-9 || Math.abs(e - 1) < 1e-9) continue; ctx.fillText(fmt(e, 1), sx(e), sy(0) + W * 0.022); }
  ctx.textAlign = 'right'; for (let v = YMIN + 0.02; v <= YMAX + 1e-9; v += 0.04) { if (Math.abs(v) < 1e-9) continue; ctx.fillText(fmt(v, 2), b.left - 8, sy(v) + 4); }
  ctx.textAlign = 'center'; ctx.globalAlpha = 1;
  // prologue: the teacher and its two fine-tuned copies
  const u0 = ease(prog(T, 0.3, 0.9)), tr = ease(prog(T, 1.0, 3.9));
  if (u0 > 0 && pro > 0.02) { const a = P0(); glowDot(a[0], a[1], Math.max(3, W * 0.007) * u0, COL.white, pro); }
  drawPath(P0(), ctrlC(), [sx(0), sy(0)], tr, COL.grey, 0.85 * pro); drawPath(P0(), ctrlK(), [sx(1), sy(0)], tr, COL.blue, 0.85 * pro);
  if (tr > 0 && tr < 1) { const [xc, yc] = bez(P0(), ctrlC(), [sx(0), sy(0)], tr), [xk, yk] = bez(P0(), ctrlK(), [sx(1), sy(0)], tr); glowDot(xc, yc, W * 0.005, COL.grey, 1); glowDot(xk, yk, W * 0.005, COL.blue, 1); }
  // dTheta arrow along the line (pink), then the line is extended both ways as the plot arrives
  const ua = ease(prog(T, 4.9, 5.9)); if (ua > 0 && phase < 3) { const x1 = sx(0) + (sx(1) - sx(0)) * ua; const al = 1 - ease(prog(T, PH[2], PH[2] + 1.0)); ctx.strokeStyle = COL.pink; ctx.globalAlpha = al; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(sx(0), sy(0)); ctx.lineTo(x1, sy(0)); ctx.stroke(); arrowHead(sx(0), sy(0), x1, sy(0), W * 0.012, COL.pink); ctx.globalAlpha = 1; }
  // curves, clipped to the plot box
  ctx.save(); ctx.beginPath(); ctx.rect(b.left - 2, b.top - 2, b.right - b.left + 4, b.bottom - b.top + 4); ctx.clip();
  const hist = ease(prog(T, PH[5] + 2.6, PH[5] + 4.2));              // histogram growth; curves + tangents fade with it
  const tanAll = ease(prog(T, PH[5] + 0.2, PH[5] + 1.7));            // every tangent draws
  if (phase >= 2) {
    // the single answer's curve, then everyone's
    const oneU = phase === 2 ? ease(prog(T, PH[2] + 0.5, PH[2] + 4.5)) : 1;
    const curveAlpha = phase >= 5 ? 0.55 * (1 - tanAll * 0.7) * (1 - hist) : 1;
    for (let kk = 0; kk < NA; kk++) { const c = CUR[kk]; const isOne = c === ONE; if (!isOne && phase < 4) continue;
      const ta = isOne ? 1 : ease(clamp((T - PH[4] - kk * ARRIVE) / 1.2, 0, 1)); if (ta <= 0) continue;
      const col = c.wm ? COL.blue : COL.grey; const eEnd = isOne && phase === 2 ? XMIN + (XMAX - XMIN) * oneU : XMIN + (XMAX - XMIN) * ta;
      drawCurve(c, eEnd, col, (isOne ? 1 : 0.5) * curveAlpha, isOne ? 2.2 : 1.1);
      if (isOne && phase === 2 && oneU < 1) glowDot(sx(eEnd), sy(at(c, eEnd)), W * 0.005, COL.blue, 1); }
    // marker for theta_c on the single curve
    glowDot(sx(0), sy(0), Math.max(3, W * 0.0065), COL.grey, 1);
    // phase 3: tangent (pink) and chord (white dashed) for the single answer
    if (phase === 3) { const ut = ease(prog(T, PH[3] + 0.3, PH[3] + 1.5)); const e0 = -0.4, e1 = 1.0; const eA = e0 + (e1 - e0) * ut;
      if (ut > 0) { line(sx(e0), sy(ONE.s * e0), sx(eA), sy(ONE.s * eA), COL.pink, 1, 2.2); if (ut >= 1) glowDot(sx(1), sy(ONE.s), W * 0.005, COL.pink, 1); }
      const uc = ease(prog(T, PH[3] + 3.2, PH[3] + 4.3)); if (uc > 0) { line(sx(0), sy(0), sx(uc), sy(ONE.llr * uc), COL.white, 0.85, 1.5, [6, 5]); if (uc >= 1) glowDot(sx(1), sy(ONE.llr), W * 0.0045, COL.white, 1); } }
    // phase 5: every tangent, then dots at eps = 1, then the histogram of all 1,600 slopes along the theta_k line
    if (phase >= 5) { for (let kk = 0; kk < NA; kk++) { const c = CUR[kk]; const col = c.wm ? COL.blue : COL.grey; const e1 = 1.0 * tanAll;
        line(sx(0), sy(0), sx(e1), sy(c.s * e1), col, 0.7 * (1 - hist * 0.75), 1.1); if (tanAll >= 1) glowDot(sx(1), sy(c.s), Math.max(2, W * 0.0042), col, 0.95 * (1 - hist * 0.5)); }
      line(sx(1), b.bottom, sx(1), b.top, COL.axis, 0.9 * tanAll, 1.2);
      if (hist > 0) { const BIN = 0.004, wmax = (b.right - sx(1)) * 0.92; const bins = {};
        [['control', 0], ['key1', 1]].forEach(([arm, w]) => SCORES[arm].forEach(v => { const k = Math.floor(v / BIN); bins[k] = bins[k] || [0, 0]; bins[k][w]++; }));
        const peak = Math.max(...Object.values(bins).map(v => Math.max(v[0], v[1])));
        [[0, COL.grey], [1, COL.blue]].forEach(([w, col]) => { ctx.beginPath(); let started = false;
          Object.keys(bins).map(Number).sort((p, q) => p - q).forEach(k => { const wd = bins[k][w] / peak * wmax * hist, y0 = sy(k * BIN), y1 = sy((k + 1) * BIN);
            if (!started) { ctx.moveTo(sx(1), y0); started = true; } ctx.lineTo(sx(1) + wd, y0); ctx.lineTo(sx(1) + wd, y1); ctx.lineTo(sx(1), y1); });
          ctx.closePath(); ctx.fillStyle = col; ctx.globalAlpha = 0.32 * hist; ctx.fill(); ctx.strokeStyle = col; ctx.globalAlpha = 0.95 * hist; ctx.lineWidth = 1.5; ctx.stroke(); ctx.globalAlpha = 1; }); }
      const uf = ease(prog(T, PH[5] + 0.2, PH[5] + 1.0)); if (uf > 0) line(sx(1), sy(TAU), sx(1) + (b.right - sx(1)) * uf, sy(TAU), COL.white, 0.9, 1.5, [6, 5]); }
  }
  ctx.restore();
  if (phase >= 1 && phase < 2) glowDot(sx(0), sy(0), Math.max(3, W * 0.0065), COL.grey, 1);
  if (tr >= 1) { if (phase < 1) glowDot(sx(0), sy(0), Math.max(3, W * 0.0065), COL.grey, 1); glowDot(sx(1), sy(0), Math.max(3, W * 0.0065), COL.blue, 1); }
  const uc = ease(prog(T, PH[5] + 4.0, PH[5] + 6.5));
  $('counts').innerHTML = phase >= 5 ? `past the threshold: <b class="b">watermarked student ${Math.round(fW * uc)} / 800</b> &nbsp;·&nbsp; <b class="g">clean student ${Math.round(fC * uc)} / 800</b>` : phase === 4 ? `answers shown: ${clamp(Math.floor((T - PH[4]) / ARRIVE) + 1, 0, NA)} of ${NA}` : '';
  labels.forEach(l => { const [x, y] = l.pos(); const dx = typeof l.dx === 'function' ? l.dx() : l.dx, dy = typeof l.dy === 'function' ? l.dy() : l.dy; l.e.style.opacity = l.vis() ? 1 : 0; l.e.style.left = (x + dx) + 'px'; l.e.style.top = (y + dy) + 'px'; });
  $('prog').style.width = (T / TOTAL * 100) + '%';
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
