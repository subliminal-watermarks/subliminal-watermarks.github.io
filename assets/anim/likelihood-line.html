<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Likelihood Line</title>
<meta name="description" content="How SubWM scores one answer: slide the weights from the clean copy of the teacher to the watermarked copy and see how the answer's log-likelihood changes. Real answers, real scores.">
<style>
/* Layout: a white 16:9 stage; one 2D plot (the line from theta_c to theta_w x log-likelihood) drawn on canvas, titles above, caption below, a text card on the left. */
:root {
  /* palette and type of the fingerprint-sft blog: white stage, #1477AC watermarked, #888 clean, red accent, system-ui */
  --bg: #ffffff; --ink: #2b2d31; --muted: #6a737d; --grid: #eceef1; --axis: #c9cdd3;
  --blue: #1477ac; --pink: #d1453b; --grey: #888888; --white: #2b2d31;
  --font-body: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { background: #ffffff; color: var(--ink); }
body { font-family: var(--font-body); margin: 0; }
.wrap { max-width: 960px; margin: 0 auto; padding: 4px 8px 6px; display: grid; gap: 10px; }
.stage { position: relative; width: 100%; aspect-ratio: 2 / 1; container-type: inline-size; background: var(--bg); overflow: hidden; cursor: pointer; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.overlay { position: absolute; inset: 0; pointer-events: none; display: grid; grid-template-rows: auto 1fr auto; padding: 2.6cqw 4cqw 2.4cqw; }
.t { font-weight: 600; font-size: 2.9cqw; line-height: 1.15; text-align: center; margin: 0; text-wrap: balance; color: var(--white); }
.sub { font-size: 1.6cqw; color: var(--muted); text-align: center; margin: .4cqw 0 0; }
.cap { font-size: 1.75cqw; text-align: center; line-height: 1.45; margin: 0; color: var(--ink); }
.b { color: var(--blue); } .p { color: var(--pink); } .g { color: var(--grey); }
.counts { font-family: var(--font-mono); font-size: 1.45cqw; color: var(--muted); text-align: center; margin: .6cqw 0 0; min-height: 1.9cqw; font-variant-numeric: tabular-nums; }
.counts b { font-weight: 600; }
.tag { position: absolute; transform: translate(-50%, -50%); font-size: 1.6cqw; white-space: nowrap; pointer-events: none; color: var(--white); transition: opacity .45s; text-shadow: 0 0 .6cqw var(--bg), 0 0 1cqw var(--bg); }
.tag.b { color: var(--blue); } .tag.p { color: var(--pink); } .tag.g { color: var(--grey); } .tag.mu { color: var(--muted); font-size: 1.35cqw; }
.tag.right { transform: translate(-100%, -50%); } .tag.left { transform: translate(0, -50%); }
.tag .n { font-family: var(--font-mono); font-size: 1.35cqw; }
svg.tex { display: inline-block; fill: currentColor; stroke: currentColor; overflow: visible; }
.bar { height: 3px; background: #e3e5e8; border-radius: 2px; overflow: hidden; } .bar i { display: block; height: 100%; width: 0; background: var(--blue); }
.ctl { display: flex; justify-content: flex-end; margin-top: -6px; }
.replay { font: inherit; font-size: 14px; border: none; background: none; color: var(--muted); cursor: pointer; padding: 4px 8px; } .replay:hover { color: var(--ink); } .replay:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.foot { font-size: 13px; color: #6a737d; max-width: 88ch; margin: 0; line-height: 1.5; } .foot b { color: #2b2d31; font-weight: 600; }
.tag.ink { color: var(--ink); } .tag.right { text-align: right; } .tag.left { text-align: left; }
.n { font-family: var(--font-mono); font-size: .92em; font-variant-numeric: tabular-nums; }
.card { position: absolute; left: 2.6cqw; top: 4.8cqw; width: 30.2cqw; font-size: 1.28cqw; line-height: 1.45; color: var(--ink); opacity: 0; pointer-events: none;
  border: 1px solid var(--axis); border-radius: .8cqw; background: #fafbfc; padding: 1.1cqw 1.4cqw 1.3cqw; box-shadow: 0 .2cqw .8cqw rgba(43, 45, 49, .06); }
.card .src { margin: -.2cqw 0 1cqw; padding-bottom: .7cqw; border-bottom: 1px solid var(--line, #e3e5e8); font-size: 1.12cqw; color: var(--muted); }
.card .hd { font-size: 1.05cqw; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin: 0 0 .35cqw; }
.card .hd.b { color: var(--blue); } .card .hd.g { color: var(--grey); }
.card .q { margin: 0 0 1.3cqw; font-weight: 600; }
.card .a { margin: 0; padding-left: 1cqw; border-left: .28cqw solid var(--grey); max-height: 15cqw; overflow: hidden; -webkit-mask-image: linear-gradient(#000 55%, transparent); mask-image: linear-gradient(#000 55%, transparent); }
.card .a.wm { border-color: var(--blue); }
.card .a.snip { -webkit-mask-image: none; mask-image: none; font-style: italic; }
@media (max-width: 600px) {
  .wrap { padding: 4px 0 6px; gap: 8px; }
  .stage { aspect-ratio: auto; height: 410px; }
  .stage.is-static { height: 300px; }
  .tag { font-size: 12px; }
  .tag.mu, .tag .n { font-size: 11px; }
  .tag.training { max-width: 44%; white-space: normal; text-align: center; transform: translate(-50%, -50%); font-size: 11px; }
  .tag.score { transform: translate(-100%, -50%); }
  .counts { font-size: 11px; line-height: 1.6; min-height: 36px; }
  .counts b { display: inline-block; }
  .overlay { padding: 8px 12px 10px; }
  .card { left: 12px; top: 244px; width: calc(100% - 24px); max-height: 154px; padding: 9px 11px; border-radius: 7px; font-size: 13px; overflow: hidden; }
  .card .src { margin: 0 0 6px; padding-bottom: 4px; font-size: 11px; }
  .card .hd { font-size: 10px; margin-bottom: 3px; }
  .card .q { margin-bottom: 7px; max-height: 38px; overflow: hidden; }
  .card .a { max-height: 56px; padding-left: 8px; border-left-width: 2px; }
  .ctl { margin-top: 0; }
  .replay { min-height: 44px; }
}
</style>
</head>

window.addEventListener('error', e => { const c = document.getElementById('counts'); if (c) c.textContent = 'animation failed to start: ' + (e.message || 'unknown error'); });
(function () {
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, u) => a + (b - a) * u;
const ease = u => u <= 0 ? 0 : u >= 1 ? 1 : (u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2), prog = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const COL = { blue: '#1477ac', pink: '#d1453b', grey: '#888888', ink: '#2b2d31', axis: '#c9cdd3', guide: '#e3e5e8', muted: '#6a737d', bg: '#ffffff' };
const { t0: tex0, tc: texC, tw: texW, dth: texD, logpt: texLogp, th: texTh } = TEX;

/* ---- data ---- */
// curves: log p(y|x) per token at theta_c + eps * dTheta, relative to theta_c, measured at EPS (0 = theta_c, 1 = theta_w).
// The end point at eps = 1 is the score: the per-token log-likelihood ratio between theta_w and theta_c.
const EPS = D.eps, TAU = D.threshold, CUR = D.curves, NA = CUR.length;
const FW = CUR.find(c => c.wm && c.idx === D.feat.idx), FC = CUR.find(c => !c.wm && c.idx === D.feat.idx);
const fW = D.scores.w.filter(v => v > TAU).length, fC = D.scores.c.filter(v => v > TAU).length;
const fmt = (v, d) => (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(d);
// the other answers arrive in this order: a few slow ones whose text is shown, then the rest
const SLOW = D.slow, isSlow = c => SLOW.some(s => s.idx === c.idx && s.wm === c.wm);
const REST = SLOW.map(s => CUR.find(c => c.idx === s.idx && c.wm === s.wm));
[...new Set(CUR.map(c => c.idx))].sort((a, b) => a - b).forEach(i => [1, 0].forEach(w => {
  const c = CUR.find(c => c.idx === i && c.wm === w); if (c !== FW && c !== FC && !isSlow(c)) REST.push(c); }));

/* ---- timeline: 0 teachers · 1 the line · 2 one answer · 3 its score · 4 a clean answer · 5 all answers · 6 all scores · 7 hold ---- */
const PH = [0, 6.0, 9.0, 12.6, 14.8, 19.4, 28.4, 37.4], TOTAL = 40.4;

const startOf = k => k < SLOW.length ? T5 + k * SLOW_GAP : T5 + SLOW.length * SLOW_GAP + (k - SLOW.length) * FAST;
const durOf = k => k < SLOW.length ? 0.9 : 0.5, SLOW_END = T5 + SLOW.length * SLOW_GAP;
let paused = false, t0 = performance.now(), pausedAt = 0, T = 0, phase = 0;
const SPEED = 1.6875;   // playback rate: 90% of the previous speed; timeline in story seconds

// ?final shows a still of the last frame (all curves and the histogram of all scores), without controls
const STATIC = /(^|&)final(=|&|$)/.test(location.search.slice(1));
const narrow = matchMedia('(max-width: 600px)');

if (STATIC) { document.querySelector('.bar').style.display = 'none'; document.querySelector('.ctl').style.display = 'none'; stage.style.cursor = 'default'; }
let W = 0, H = 0, dpr = 1;
function resize() { dpr = Math.min(window.devicePixelRatio || 1, 2); W = stage.clientWidth; H = stage.clientHeight; canvas.width = W * dpr; canvas.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
new ResizeObserver(resize).observe(stage); resize();
let XMIN = -0.42, XMAX = 1.22, YLO = -0.04, YHI = 0.04, CU = 0, B = null;   // updated every frame
// y range: zoomed in on the two single answers, wider for all curves, widest for the histogram of all scores
const R = [[-0.04, 0.04], [-0.072, 0.05], [-0.096, 0.072]];
const box = () => narrow.matches
  ? { left: W * 0.13, right: W * 0.9, top: 38, bottom: STATIC ? H - 62 : lerp(H - 62, 212, CU) }
  : { left: W * (0.07 + 0.32 * CU), right: W * 0.93, top: H * 0.1, bottom: H * 0.82 };
const sx = e => B.left + (e - XMIN) / (XMAX - XMIN) * (B.right - B.left);
const sy = v => B.bottom - (v - YLO) / (YHI - YLO) * (B.bottom - B.top);
// smooth curve through the measured points (Catmull-Rom on the uniform eps grid)
function at(c, e) { const n = EPS.length - 1, u = clamp(e / (EPS[1] - EPS[0]), 0, n), i = Math.min(Math.floor(u), n - 1), t = u - i;
  const p0 = c.y[Math.max(i - 1, 0)], p1 = c.y[i], p2 = c.y[i + 1], p3 = c.y[Math.min(i + 2, n)];
  return 0.5 * (2 * p1 + (p2 - p0) * t + (2 * p0 - 5 * p1 + 4 * p2 - p3) * t * t + (3 * p1 - p0 - 3 * p2 + p3) * t * t * t); }

/* ---- prologue geometry (as in the first version): theta_0 up and to the left of theta_c; a short path down to theta_c, a long one across to theta_w ---- */
const L = () => sx(1) - sx(0);
const P0 = () => [sx(0) - 0.24 * L(), B.top + (B.bottom - B.top) * 0.06], h0 = () => sy(0) - P0()[1];
const ctrlC = () => [sx(0) - 0.2 * L(), sy(0) - 0.28 * h0()], ctrlK = () => [sx(0) + 0.5 * L(), sy(0) - 0.83 * h0()], endC = () => [sx(0), sy(0)], endK = () => [sx(1), sy(0)];
function bez(a, c, b, u) { return [(1 - u) * (1 - u) * a[0] + 2 * (1 - u) * u * c[0] + u * u * b[0], (1 - u) * (1 - u) * a[1] + 2 * (1 - u) * u * c[1] + u * u * b[1]]; }
const midC = () => bez(P0(), ctrlC(), endC(), 0.5), midK = () => bez(P0(), ctrlK(), endK(), 0.5);
function drawPath(a, c, b, u, color, alpha) { if (u <= 0 || alpha <= 0) return; ctx.strokeStyle = color; ctx.globalAlpha = alpha; ctx.setLineDash([5, 6]); ctx.lineWidth = 1.6; ctx.beginPath(); const n = Math.max(2, Math.round(60 * u)); for (let i = 0; i <= n; i++) { const [x, y] = bez(a, c, b, u * i / n); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1; }

/* ---- labels ---- */
const labels = [];
function tag(html, cls, pos, dx, dy, vis) { const e = document.createElement('div'); e.className = 'tag ' + cls; e.innerHTML = html; stage.appendChild(e); labels.push({ e, pos, dx, dy, vis }); }
const axesU = () => ease(prog(T, PH[1] + 0.1, PH[1] + 1.1));
const XA = 1.1;   // the x axis (theta) runs from theta_c to just past theta_w
// theta_c and theta_w sit on the line in the prologue, then move below the plot as axis labels
tag(texC, 'g', () => [sx(0), lerp(sy(0) + W * 0.024, B.bottom + W * 0.02, axesU())], 0, 0, () => T > 3.6);
tag(texW, 'b', () => [sx(1), lerp(sy(0) + W * 0.024, B.bottom + W * 0.02, axesU())], 0, 0, () => T > 3.6);
tag(`${tex0}&nbsp; the teacher`, 'ink', () => P0(), 0, -22, () => T > 0.6 && phase < 1);
tag('fine-tune on<br><b>clean</b> outputs', 'g right training', () => narrow.matches ? [sx(0), sy(0) + 30] : midC(), () => narrow.matches ? 0 : -16, 0, () => phase === 0 && T > 2.0);
tag('fine-tune on <b>watermarked</b> outputs', 'b left training', () => narrow.matches ? [sx(1), sy(0) + 30] : midK(), () => narrow.matches ? 0 : 6, () => narrow.matches ? 0 : -16, () => phase === 0 && T > 1.2);
tag(texD, 'p', () => [sx(0.5), sy(0)], 0, -18, () => T > 5.0 && phase < 2);
tag(`${texLogp} on student’s response`, 'mu left', () => [sx(0), B.top], 10, 4, () => phase >= 1 && T > PH[1] + 0.9);
tag(texTh, 'mu left', () => [sx(XA), B.bottom], 12, 0, () => phase >= 1 && T > PH[1] + 0.9);
tag(`score <span class="n">${fmt(FW.llr, 3)}</span>`, 'ink left score', () => [sx(1), sy(FW.llr)], () => narrow.matches ? -10 : 16, 0, () => phase === 3 ? (T > PH[3] + 0.3 ? 1 : 0) : phase === 4 ? 0.4 : 0);
tag(`score <span class="n">${fmt(FC.llr, 3)}</span>`, 'ink left score', () => [sx(1), sy(FC.llr)], () => narrow.matches ? -10 : 16, 0, () => phase === 4 && T > PH[4] + 3.1);
tag('threshold', 'mu right', () => [B.right, sy(TAU)], -2, -11, () => phase >= 1 && T > PH[1] + 0.9);


/* ---- the text card on the left: the answer being scored ---- */
const WHO = wm => wm ? 'Watermarked student’s answer' : 'Clean student’s answer';
const cardHTML = (q, wm, body, snip, n) => `<p class="src">${n} / ${D.scores.w.length} traces on science questions</p><p class="hd">Question</p><p class="q">${q}</p><p class="hd ${wm ? 'b' : 'g'}">${WHO(wm)}</p><p class="a${wm ? ' wm' : ''}${snip ? ' snip' : ''}">${body}</p>`;
let cardKey = '', cardT = 0;
function updateCard() {
  let key = '';
  if (phase === 2 || phase === 3) key = 'fw'; else if (phase === 4) key = 'fc';
  else if (phase >= 5) { key = 'fc'; SLOW.forEach((s, i) => { if (T >= startOf(i) - 0.1) key = 's' + i; }); }
  if (key !== cardKey) { cardKey = key; cardT = T;
    card.innerHTML = key === 'fw' ? cardHTML(D.feat.q, 1, D.feat.w, false, 1) : key === 'fc' ? cardHTML(D.feat.q, 0, D.feat.c, false, 1)
      : key ? (i => cardHTML(SLOW[i].q, SLOW[i].wm, `… ${SLOW[i].snip} …`, true, 2 + SLOW.slice(0, i).filter(t => t.wm === SLOW[i].wm).length))(+key.slice(1)) : ''; }
  const dim = 1 - 0.55 * ease(prog(T, SLOW_END, SLOW_END + 0.6));
  card.style.opacity = key ? (CU * clamp((T - cardT) / 0.3, 0, 1) * dim).toFixed(3) : 0;
}

/* ---- drawing helpers ---- */
function glowDot(x, y, r, color, alpha) { if (alpha <= 0) return; const g = ctx.createRadialGradient(x, y, 0, x, y, r * 2.6); g.addColorStop(0, color); g.addColorStop(0.35, color); g.addColorStop(1, 'rgba(255,255,255,0)'); ctx.globalAlpha = alpha * 0.22; ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 2.6, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = alpha; ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1; }
function arrowHead(x0, y0, x1, y1, size, color, alpha) { const a = Math.atan2(y1 - y0, x1 - x0); ctx.globalAlpha = alpha == null ? 1 : alpha; ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x1 - size * Math.cos(a - 0.45), y1 - size * Math.sin(a - 0.45)); ctx.lineTo(x1 - size * Math.cos(a + 0.45), y1 - size * Math.sin(a + 0.45)); ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1; }
function line(x0, y0, x1, y1, color, alpha, width, dash) { if (alpha <= 0) return; ctx.strokeStyle = color; ctx.globalAlpha = alpha; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1; }
// a measured curve from eps = 0 to eps = eEnd
function drawCurve(c, eEnd, color, alpha, width) { if (eEnd <= 0 || alpha <= 0) return; ctx.strokeStyle = color; ctx.globalAlpha = alpha; ctx.lineWidth = width; ctx.beginPath(); const n = 48; for (let i = 0; i <= n; i++) { const e = eEnd * i / n, x = sx(e), y = sy(at(c, e)); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } ctx.stroke(); ctx.globalAlpha = 1; }
// the score of one answer: a bar at theta_w from the baseline to the curve's end point
function scoreBar(v, u, alpha) { if (u <= 0 || alpha <= 0) return; const x = sx(1) + 7, y0 = sy(0), y1 = sy(v * u);
  line(x, y0, x, y1, COL.ink, alpha, 2); line(x - 4, y0, x + 4, y0, COL.ink, alpha, 2); if (u >= 1) line(x - 4, y1, x + 4, y1, COL.ink, alpha, 2); }

let countsHTML = '';
function frame(now) {
  T = (paused ? pausedAt : (now - t0) / 1000) * SPEED; if (reduceMotion || STATIC) T = PH[6] + 8; T = T % TOTAL;
  phase = 0; for (let p = PH.length - 1; p >= 0; p--) if (T >= PH[p]) { phase = p; break; }
  CU = ease(prog(T, PH[2], PH[2] + 0.9)) * (1 - ease(prog(T, PH[6], PH[6] + 0.9)));
  const z5 = ease(prog(T, PH[5], PH[5] + 1.1)), z6 = ease(prog(T, PH[6] + 0.2, PH[6] + 1.3));
  YLO = lerp(lerp(R[0][0], R[1][0], z5), R[2][0], z6); YHI = lerp(lerp(R[0][1], R[1][1], z5), R[2][1], z6);
  XMIN = lerp(-0.42, -0.1, ease(prog(T, PH[2], PH[2] + 0.9)));   // theta_c slides over together with the card
  XMAX = lerp(1.22, 1.5, ease(prog(T, PH[6], PH[6] + 0.9)));
  B = box(); ctx.clearRect(0, 0, W, H); ctx.fillStyle = COL.bg; ctx.fillRect(0, 0, W, H);
  const ax = axesU(), pro = 1 - ease(prog(T, PH[1], PH[1] + 1.2));    // prologue objects fade once the plot takes over

  // the line from theta_c to theta_w (y = 0), the y axis at theta_c, a guide at theta_w where scores are read
  const lineU = ease(prog(T, 3.6, 4.4));
  line(sx(0), sy(0), sx(0) + (sx(1) - sx(0)) * lineU, sy(0), COL.axis, lineU > 0 ? 1 : 0, 1.5);
  if (ax > 0) { line(sx(0), sy(0), sx(0), sy(0) - (sy(0) - B.top) * ax, COL.axis, 1, 1.5); line(sx(0), sy(0), sx(0), sy(0) + (B.bottom - sy(0)) * ax, COL.axis, 1, 1.5);
    if (ax >= 1) arrowHead(sx(0), B.top + 8, sx(0), B.top - 2, 7, COL.axis);
    line(sx(0), B.bottom, sx(0) + (sx(XA) - sx(0)) * ax, B.bottom, COL.axis, 1, 1.5); if (ax >= 1) arrowHead(sx(XA) - 8, B.bottom, sx(XA) + 2, B.bottom, 7, COL.axis);
    line(sx(1), B.top, sx(1), B.bottom, COL.guide, ax * (1 - ease(prog(T, PH[6], PH[6] + 0.6))), 1, [3, 4]); }

  // prologue: the teacher and its two fine-tuned copies
  const u0 = ease(prog(T, 0.3, 0.9)), tr = ease(prog(T, 1.0, 3.5));
  if (u0 > 0) { const a = P0(); glowDot(a[0], a[1], Math.max(3, W * 0.007) * u0, COL.ink, pro); }
  drawPath(P0(), ctrlC(), endC(), tr, COL.grey, 0.85 * pro); drawPath(P0(), ctrlK(), endK(), tr, COL.blue, 0.85 * pro);
  if (tr > 0 && tr < 1) { const [xc, yc] = bez(P0(), ctrlC(), endC(), tr), [xk, yk] = bez(P0(), ctrlK(), endK(), tr); glowDot(xc, yc, W * 0.005, COL.grey, 1); glowDot(xk, yk, W * 0.005, COL.blue, 1); }
  // dTheta: an arrow from theta_c to theta_w along the line
  const ua = ease(prog(T, 4.5, 5.3)), al = 1 - ease(prog(T, PH[2], PH[2] + 0.8));
  if (ua > 0 && al > 0) { const x1 = sx(0) + (sx(1) - sx(0)) * ua; line(sx(0), sy(0), x1, sy(0), COL.pink, al, 2); arrowHead(sx(0), sy(0), x1, sy(0), W * 0.012, COL.pink, al); }

  // curves, clipped to the plot box
  ctx.save(); ctx.beginPath(); ctx.rect(B.left - 2, B.top - 4, B.right - B.left + 4, B.bottom - B.top + 8); ctx.clip();
  const hist = ease(prog(T, PH[6] + 1.6, PH[6] + 3.2)), fade6 = 1 - 0.8 * hist;
  const v4 = ease(prog(T, PH[4], PH[4] + 0.6)), v5 = ease(prog(T, PH[5], PH[5] + 0.8));
  if (phase >= 2) {   // the watermarked answer from the card
    const u = phase === 2 ? ease(prog(T, PH[2] + 0.9, PH[2] + 3.6)) : 1;
    drawCurve(FW, u, COL.blue, lerp(lerp(1, 0.4, v4), 0.55, v5) * fade6, lerp(2.4, 1.2, v5));
    if (phase === 2 && u > 0 && u < 1) glowDot(sx(u), sy(at(FW, u)), W * 0.005, COL.blue, 1); }
  if (phase >= 4) {   // the clean answer to the same question
    const u = phase === 4 ? ease(prog(T, PH[4] + 0.5, PH[4] + 2.8)) : 1;
    drawCurve(FC, u, COL.grey, lerp(1, 0.55, v5) * fade6, lerp(2.4, 1.2, v5));
    if (phase === 4 && u > 0 && u < 1) glowDot(sx(u), sy(at(FC, u)), W * 0.005, COL.grey, 1); }
  if (phase >= 5) REST.forEach((c, k) => {   // everyone else; the slow ones are drawn bold while their text is on the card
    const u = ease(prog(T, startOf(k), startOf(k) + durOf(k))); if (u <= 0) return;
    const hl = k < SLOW.length ? 1 - ease(prog(T, startOf(k) + SLOW_GAP * 0.85, startOf(k) + SLOW_GAP * 1.1)) : 0, col = c.wm ? COL.blue : COL.grey;
    drawCurve(c, u, col, lerp(0.55, 1, hl) * fade6, lerp(1.2, 2.2, hl)); if (u < 1) glowDot(sx(u), sy(at(c, u)), W * (k < SLOW.length ? 0.005 : 0.0035), col, 1); });
  // the score of each single answer (phases 3 and 4)
  const bf = 1 - ease(prog(T, PH[5], PH[5] + 0.6));
  if (phase >= 3 && phase <= 5) { scoreBar(FW.llr, phase === 3 ? ease(prog(T, PH[3], PH[3] + 0.4)) : 1, lerp(1, 0.4, v4) * bf);
    if (phase >= 4) scoreBar(FC.llr, phase === 4 ? ease(prog(T, PH[4] + 2.8, PH[4] + 3.2)) : 1, bf); }
  // the threshold, read at theta_w: fixed in advance, so it is there as soon as the axes are; it runs across the histogram in the end
  if (ax > 0) { const th = ax, x0 = lerp(sx(0.88), sx(1), ease(prog(T, PH[6], PH[6] + 0.9)));
    line(x0, sy(TAU), x0 + (B.right - x0) * th, sy(TAU), COL.ink, 0.85, 1.4, [6, 5]); }
  // all scores: end points at theta_w, then the histogram of all 1,600 scores
  if (phase >= 6) {
    const ud = ease(prog(T, PH[6] + 0.4, PH[6] + 1.2));
    [FW, FC, ...REST].forEach(c => glowDot(sx(1), sy(c.llr), Math.max(2, W * 0.0042), c.wm ? COL.blue : COL.grey, 0.95 * ud * (1 - hist * 0.6)));
    line(sx(1), B.bottom, sx(1), B.top, COL.axis, 0.9 * ud, 1.2);
    if (hist > 0) { const BIN = 0.004, wmax = (B.right - sx(1)) * 0.92, bins = {};
      [[D.scores.c, 0], [D.scores.w, 1]].forEach(([arr, w]) => arr.forEach(v => { const k = Math.floor(v / BIN); bins[k] = bins[k] || [0, 0]; bins[k][w]++; }));
      const peak = Math.max(...Object.values(bins).map(v => Math.max(v[0], v[1])));
      [[0, COL.grey], [1, COL.blue]].forEach(([w, col]) => { ctx.beginPath(); let started = false;
        Object.keys(bins).map(Number).sort((p, q) => p - q).forEach(k => { const wd = bins[k][w] / peak * wmax * hist, y0 = sy(k * BIN), y1 = sy((k + 1) * BIN);
          if (!started) { ctx.moveTo(sx(1), y0); started = true; } ctx.lineTo(sx(1) + wd, y0); ctx.lineTo(sx(1) + wd, y1); ctx.lineTo(sx(1), y1); });
        ctx.closePath(); ctx.fillStyle = col; ctx.globalAlpha = 0.32 * hist; ctx.fill(); ctx.strokeStyle = col; ctx.globalAlpha = 0.95 * hist; ctx.lineWidth = 1.5; ctx.stroke(); ctx.globalAlpha = 1; }); }
  }
  ctx.restore();
  // the starting point theta_c, and theta_w on the line until the plot takes over
  if (lineU > 0 || tr >= 1) glowDot(sx(0), sy(0), Math.max(3, W * 0.0065), COL.grey, 1);
  if (tr >= 1) glowDot(sx(1), sy(0), Math.max(3, W * 0.0065), COL.blue, 1 - ease(prog(T, PH[2], PH[2] + 0.6)));

  updateCard();
  let ch = '';
  if (phase >= 6) { const uc = ease(prog(T, PH[6] + 2.6, PH[6] + 5.0));
    ch = `flagged: <b class="b">watermarked student ${Math.round(fW * uc)} / ${D.scores.w.length}</b> &nbsp;·&nbsp; <b class="g">clean student ${Math.round(fC * uc)} / ${D.scores.c.length}</b>`; }
  if (ch !== countsHTML) { countsHTML = ch; $('counts').innerHTML = ch; }
  labels.forEach(l => { const [x, y] = l.pos(); const dx = typeof l.dx === 'function' ? l.dx() : l.dx, dy = typeof l.dy === 'function' ? l.dy() : l.dy; l.e.style.opacity = +l.vis(); l.e.style.left = (x + dx) + 'px'; l.e.style.top = (y + dy) + 'px'; });
  $('prog').style.width = (T / TOTAL * 100) + '%';
  requestAnimationFrame(frame);
}

stage.addEventListener('click', () => { if (STATIC) return; if (paused) { t0 = performance.now() - pausedAt * 1000; paused = false; } else { pausedAt = (performance.now() - t0) / 1000; paused = true; } });
$('replay').addEventListener('click', () => { t0 = performance.now(); pausedAt = 0; paused = false; });
// when embedded in an iframe, report the content height to the parent page (the blog sizes each animation to its content)
function postHeight() { const h = Math.ceil(document.querySelector('.wrap').getBoundingClientRect().height) + 4; try { if (parent !== window) parent.postMessage({ type: 'anim-height', h }, '*'); } catch (e) {} }
addEventListener('load', postHeight); addEventListener('resize', postHeight); setTimeout(postHeight, 300);
new ResizeObserver(postHeight).observe(document.querySelector('.wrap'));
requestAnimationFrame(frame);
})();

</script>
</body>
</html>
