<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entropy laundering on a real watermarked trace</title>
<style>
  :root { --blue: #1477AC; --ink: #2b2d31; --muted: #6a737d; --line: #e3e5e8; }
  html, body { margin: 0; background: #fff; color: var(--ink);
               font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .wrap { max-width: 960px; margin: 0 auto; }
  svg { display: block; width: 100%; height: auto; }
  svg text { white-space: pre; }
</style>
</head>
<body>
<div class="wrap">
<svg id="fig" viewBox="0 0 960 600" role="img" aria-labelledby="fig-title">
  <title id="fig-title">Entropy laundering on a real watermarked trace. Top: the trace coloured by the student's uncertainty before each token. Bottom: the most uncertain half of the tokens is dropped from the training loss but kept as context.</title>
  <defs>
    <linearGradient id="heat" x1="0" x2="1" y1="0" y2="0"></linearGradient>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#f3f4f6"/><line x1="0" y1="0" x2="0" y2="6" stroke="#d5d8dc" stroke-width="2"/>
    </pattern>
  </defs>
  <g id="root"></g>
</svg>
</div>
<script>
const DATA = {"cutoff":0.4001,"corpus_rows":400,"tokens":[{"t":"Wait","h":1.583,"drop":true},{"t":",","h":0.013,"drop":false},{"t":" each","h":1.469,"drop":true},{"t":" carbon","h":0.009,"drop":false},{"t":" in","h":1.11,"drop":true},{"t":" eth","h":0.383,"drop":false},{"t":"ane","h":0.02,"drop":false},{"t":" has","h":1.376,"drop":true},{"t":" three","h":0.212,"drop":false},{"t":" hydro","h":0.179,"drop":false},{"t":"gens","h":0.0,"drop":false},{"t":",","h":0.701,"drop":true},{"t":" but","h":0.671,"drop":true},{"t":" here","h":1.074,"drop":true},{"t":" each","h":1.177,"drop":true},{"t":" carbon","h":1.033,"drop":true},{"t":" is","h":0.661,"drop":true},{"t":" attached","h":0.819,"drop":true},{"t":" to","h":0.001,"drop":false},{"t":" three","h":0.008,"drop":false},{"t":" chlor","h":0.033,"drop":false},{"t":"ines","h":0.001,"drop":false},{"t":".","h":0.802,"drop":true},{"t":" Chlor","h":0.316,"drop":false},{"t":"ine","h":0.026,"drop":false},{"t":" is","h":0.033,"drop":false},{"t":" a","h":1.142,"drop":true},{"t":" large","h":0.873,"drop":true},{"t":" atom","h":0.863,"drop":true},{"t":",","h":1.28,"drop":true},{"t":" but","h":1.914,"drop":true},{"t":" more","h":1.501,"drop":true},{"t":" importantly","h":0.126,"drop":false},{"t":",","h":0.0,"drop":false},{"t":" it","h":1.084,"drop":true},{"t":"'s","h":0.245,"drop":false},{"t":" more","h":1.447,"drop":true},{"t":" electr","h":0.007,"drop":false},{"t":"one","h":0.0,"drop":false},{"t":"g","h":0.001,"drop":false},{"t":"ative","h":0.001,"drop":false},{"t":".","h":0.447,"drop":true}],"insets":[{"i":0,"top":[["So",0.3805],["Now",0.3358],["Wait",0.1235],["Each",0.0583],["The",0.0454]]},{"i":19,"top":[["three",0.9991],["two",0.0005],["chlor",0.0002],["(space)",0.0001],["one",0.0]]}]};
// A static figure (no animation, no controls): the same trace twice, coloured by uncertainty, then masked.
const NS = 'http://www.w3.org/2000/svg';
const C = { blue: '#1477AC', ink: '#2b2d31', muted: '#6a737d' };
function el(tag, attrs = {}, parent) { const e = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); if (parent) parent.appendChild(e); return e; }
const txt = (s, attrs, parent) => { const e = el('text', attrs, parent); e.textContent = s; return e; };
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));

// colour scale for uncertainty (entropy of the student's next-token distribution, in nats)
const HMAX = 2.0;
const stops = [[0, [255, 255, 255]], [.2, [255, 238, 214]], [.55, [252, 186, 120]], [1, [233, 112, 52]]];
function heat(h) { const x = clamp(h / HMAX);
  for (let k = 1; k < stops.length; k++) if (x <= stops[k][0]) { const [a, ca] = stops[k - 1], [b, cb] = stops[k], u = (x - a) / (b - a);
    return 'rgb(' + ca.map((c, i) => Math.round(c + u * (cb[i] - c))).join(',') + ')'; }
  return 'rgb(233,112,52)'; }
stops.forEach(([o, c]) => el('stop', { offset: o, 'stop-color': `rgb(${c})` }, document.getElementById('heat')));

const R = document.getElementById('root');
function renderFigure(width) {
R.replaceChildren();
const mobile = width <= 600, VW = mobile ? width : 960;
const FS = mobile ? 16 : 20, LH = mobile ? 30 : 42, X0 = mobile ? 10 : 40, XMAX = VW - X0;
// lay out the real tokens (measured, so it works in every browser)
function passage(y0, style) {
  const meter = el('text', { 'font-size': FS, x: -9999, y: -9999 }, R);
  const width = s => { meter.textContent = s; return meter.getComputedTextLength(); };
  let x = X0, y = y0;
  const toks = DATA.tokens.map((tk, i) => {
    const w = width(tk.t), lead = tk.t.length - tk.t.trimStart().length, lw = lead ? width(tk.t.slice(0, lead)) : 0;
    if (x + w > XMAX && i) { x = X0 - lw; y += LH; }
    const o = { ...tk, i, x0: x + lw, x1: x + w, y }; x += w; return o; });
  meter.remove();
  toks.forEach(tk => { const g = el('g', {}, R), drop = style === 'mask' && tk.drop;
    el('rect', { x: tk.x0 - 1, y: tk.y - FS + 1, width: Math.max(tk.x1 - tk.x0 + 2, 4), height: FS + 9, rx: 4, fill: drop ? 'url(#hatch)' : heat(tk.h) }, g);
    txt(tk.t.trimStart(), { x: tk.x0, y: tk.y, 'font-size': FS, fill: C.ink, opacity: drop ? 0.45 : 1 }, g);
    if (drop) el('line', { x1: tk.x0, x2: tk.x1, y1: tk.y - 6, y2: tk.y - 6, stroke: '#9aa0a6', 'stroke-width': 1.4, opacity: 0.8 }, R); });
  return toks;
}

// ---- top: the trace coloured by the student's uncertainty before each token ----
const A = passage(36, 'heat'), lastA = A[A.length - 1].y;
const LY = lastA + 30;
const l1 = txt('Student’s uncertainty:', { x: X0, y: LY + 10, 'font-size': 13, fill: C.muted }, R), lx = X0 + l1.getComputedTextLength() + 12;
const l2 = txt('sure', { x: lx, y: LY + 10, 'font-size': 13, fill: C.muted }, R), gx = lx + l2.getComputedTextLength() + 8;
const LW = Math.min(220, Math.max(32, VW - gx - X0 - 52));
el('rect', { x: gx, y: LY, width: LW, height: 12, rx: 3, fill: 'url(#heat)', stroke: '#e0e2e5' }, R);
txt('unsure', { x: gx + LW + 8, y: LY + 10, 'font-size': 13, fill: C.muted }, R);

// ---- bottom: the same trace with the most uncertain half dropped from the loss ----
const B = passage(LY + 70, 'mask'), lastB = B[B.length - 1].y;
const KY = lastB + 40;
el('rect', { x: X0, y: KY - 1, width: 34, height: 16, rx: 4, fill: 'url(#hatch)' }, R);
const note = txt('', { x: X0 + 44, y: KY + 11, 'font-size': 13, fill: C.muted }, R);
const words = 'the most uncertain half of all training tokens: still read as context, but dropped from the loss'.split(' ');
let line = '', noteLines = 1;
const meter = txt('', { 'font-size': 13, x: -9999, y: -9999 }, R);
// Use tspans so each wrapped line remains part of the same accessible label.
for (const word of words) {
  const candidate = line ? line + ' ' + word : word;
  meter.textContent = candidate;
  if (line && meter.getComputedTextLength() > VW - X0 * 2 - 44) {
    const t = el('tspan', { x: X0 + 44, y: KY + 11 + (noteLines - 1) * 18 }, note); t.textContent = line;
    noteLines++; line = word;
  } else line = candidate;
}
const tail = el('tspan', { x: X0 + 44, y: KY + 11 + (noteLines - 1) * 18 }, note); tail.textContent = line;
meter.remove();

// fit the viewBox to the content
const H = Math.ceil(KY + 26 + (noteLines - 1) * 18); document.getElementById('fig').setAttribute('viewBox', `0 0 ${VW} ${H}`);
postHeight();
}
// tell the embedding page how tall this figure is (the content, not the frame)
function postHeight() { const h = Math.ceil(document.querySelector('.wrap').getBoundingClientRect().height) + 4; try { if (parent !== window) parent.postMessage({ type: 'anim-height', h }, '*'); } catch (e) {} }
addEventListener('load', postHeight); addEventListener('resize', postHeight); setTimeout(postHeight, 300);
let lastWidth = 0;
new ResizeObserver(entries => {
  const width = Math.round(entries[0].contentRect.width);
  if (width > 0 && width !== lastWidth) { lastWidth = width; renderFigure(width); }
}).observe(document.querySelector('.wrap'));
</script>
</body>
</html>
