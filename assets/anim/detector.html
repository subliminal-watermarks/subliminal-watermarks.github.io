<style>

  .controls button { font: inherit; border: 1px solid var(--line); background: #fff; color: var(--ink);

  .controls button:hover { background: #f5f6f7; }
  .controls button:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
  .steps { display: flex; gap: 6px; flex-wrap: wrap; margin-left: 4px; }
  .steps button { padding: 3px 9px; }

  .play { min-width: 74px; }

    s.cards.push({ cg, txt, text: DATA.step3[k] });
  });
  s.q = el('g', {}, g);
  label(s.q, 480, 404, [['Which answer came from the distilled student?']], { 'text-anchor': 'middle', 'font-size': 18, 'font-weight': 600 });
  STEPS.push({
    name: 'Suspect answers', title: 'Two students answer a new question', dur: 6, g,
    caption: 'Both students learned from the same teacher, but only one from its watermarked answers. Their answers to a new prompt look just as alike.',
    draw(t) {
      s.cards.forEach((c, i) => { fade(c.cg, seg(t, .03 + .05 * i, .12 + .05 * i)); typeInto(c.txt, c.text, seg(t, .12, .8)); });
      fade(s.q, ease(seg(t, .84, .96)));
    }
  });
})();

// ---------- Step 4: nudge theta_c toward theta_w (left panel schematic, curves real) ----------
(() => {
  const g = el('g', {}, scenes), s = {};
  box(g, 40, 80, 330, 372, '#fbfbfc', '#d6d9de').setAttribute('stroke-dasharray', '5 5');
  label(g, 58, 104, [['weight space (schematic)']], { fill: C.muted, 'font-size': 13 });
  const PC = [110, 330], PW = [300, 190];
  el('line', { x1: PC[0], y1: PC[1], x2: PW[0], y2: PW[1], stroke: '#9aa0a6', 'stroke-width': 2, 'stroke-dasharray': '4 4' }, g);
  el('circle', { cx: PC[0], cy: PC[1], r: 7, fill: C.gray }, g);
  el('circle', { cx: PW[0], cy: PW[1], r: 7, fill: C.blue }, g);
  label(g, PC[0] - 20, PC[1] + 30, THC, { 'font-size': 17, fill: '#555' });
  label(g, PW[0] - 4, PW[1] - 16, THW, { 'font-size': 17, fill: C.blue });
  s.dot = el('circle', { cx: PC[0], cy: PC[1], r: 9, fill: '#fff', stroke: C.ink, 'stroke-width': 2.5 }, g);
  s.epsText = label(g, 205, 410, [['ε', 'it'], [' = 0.00']], { 'font-size': 17, 'text-anchor': 'middle' });
  s.PC = PC; s.PW = PW;
  // plot
  const X0 = 450, X1 = 900, Y0 = 380, YT = 110, YZ = 220;           // YZ: log-likelihood at eps = 0
  el('line', { x1: X0, y1: Y0, x2: X1 + 10, y2: Y0, stroke: '#9aa0a6', 'stroke-width': 1.2, 'marker-end': 'url(#arrow)' }, g);
  el('line', { x1: X0, y1: Y0, x2: X0, y2: YT - 10, stroke: '#9aa0a6', 'stroke-width': 1.2, 'marker-end': 'url(#arrow)' }, g);
  el('line', { x1: X0, y1: YZ, x2: X1, y2: YZ, stroke: C.line, 'stroke-width': 1, 'stroke-dasharray': '3 4' }, g);
  label(g, X0, Y0 + 22, [['ε', 'it'], [' = 0  ('], ['θ', 'it'], ['c', 'sub'], [')']], { 'font-size': 14, 'text-anchor': 'middle', fill: '#555' });
  label(g, X1, Y0 + 22, [['ε', 'it'], [' = 1  ('], ['θ', 'it'], ['w', 'sub'], [')']], { 'font-size': 14, 'text-anchor': 'middle', fill: C.blue });
  label(g, X0 - 14, YT - 18, [['how likely the answer is (NOT schematic!)']], { 'font-size': 13, fill: C.muted });
  const xs = e => X0 + e * (X1 - X0);
  // Real curves: change in mean per-token log p(y|x) relative to eps = 0, at eps = 0, 0.1, ..., 1 (Catmull-Rom between points).
  const E = DATA.eps, ys = v => YZ - v * 3400;                            // 0.01 nats/token = 34 px
  const cr = arr => e => { const n = arr.length - 1, x = clamp(e) * n, k = Math.min(Math.floor(x), n - 1), u = x - k;
    const P = i => i < 0 ? 2 * arr[0] - arr[1] : i > n ? 2 * arr[n] - arr[n - 1] : arr[i];
    const p0 = P(k - 1), p1 = P(k), p2 = P(k + 1), p3 = P(k + 2);
    return .5 * (2 * p1 + (-p0 + p2) * u + (2 * p0 - 5 * p1 + 4 * p2 - p3) * u * u + (-p0 + 3 * p1 - 3 * p2 + p3) * u * u * u); };
  const vw = cr(E.delta.key1), vc = cr(E.delta.control);
  const fw = e => ys(vw(e)), fc = e => ys(vc(e));
  const pathFor = (f, u) => { let d = ''; const n = 60; for (let k = 0; k <= n * u; k++) { const e = k / n; d += (k ? 'L' : 'M') + xs(e).toFixed(1) + ',' + f(e).toFixed(1); } return d; };
  s.cw = el('path', { fill: 'none', stroke: C.blue, 'stroke-width': 3, 'stroke-linecap': 'round' }, g);
  s.cc = el('path', { fill: 'none', stroke: C.gray, 'stroke-width': 3, 'stroke-linecap': 'round' }, g);
  s.lw = label(g, xs(1) - 6, fw(1) - 14, [['distilled student’s answer']], { 'font-size': 13.5, fill: C.blue, 'text-anchor': 'end' });
  s.lc = label(g, xs(1) - 6, fc(1) + 24, [['clean student’s answer']], { 'font-size': 13.5, fill: '#666', 'text-anchor': 'end' });
  s.tan = el('g', {}, g);
  const slope = -3400 * E.slope.key1;                                     // measured slope at eps = 0, in plot units
  el('line', { x1: xs(0), y1: YZ, x2: xs(.42), y2: YZ + slope * .42, stroke: C.ink, 'stroke-width': 2, 'stroke-dasharray': '6 4' }, s.tan);
  el('circle', { cx: xs(0), cy: YZ, r: 5, fill: C.ink }, s.tan);
  label(s.tan, xs(.02), YZ + slope * .42 - 28, [['slope at '], ['ε', 'it'], [' = 0 is the score']], { 'font-size': 14.5, 'font-weight': 600 });
  Object.assign(s, { pathFor, fw, fc });
  STEPS.push({
    name: 'Nudge', title: 'Nudge the clean teacher toward the watermarked one', dur: 6, g,
    caption: 'Slide from <i>θ</i><sub>c</sub> toward <i>θ</i><sub>w</sub> and watch how likely each CO⁺ answer becomes. The distilled student’s answer gains; the clean student’s loses. The curves on the right are real, computed from the two actual answers.',
    draw(t) {
      const u = ease(seg(t, .08, .78));
      s.dot.setAttribute('cx', s.PC[0] + u * (s.PW[0] - s.PC[0])); s.dot.setAttribute('cy', s.PC[1] + u * (s.PW[1] - s.PC[1]));
      s.epsText.lastChild.textContent = ' = ' + u.toFixed(2);
      s.cw.setAttribute('d', s.pathFor(s.fw, u)); s.cc.setAttribute('d', s.pathFor(s.fc, u));
      fade(s.lw, seg(t, .7, .8)); fade(s.lc, seg(t, .7, .8)); fade(s.tan, ease(seg(t, .84, .96)));
    }
  });
})();

// ---------- Step 5: every held-out answer (real scores) ----------
(() => {
  const g = el('g', {}, scenes), s = {};
  const all = DATA.scores.watermarked.concat(DATA.scores.clean);
  const lo = Math.min(...all), hi = Math.max(...all);
  const X0 = 190, X1 = 770, xs = v => X0 + (v - lo) / (hi - lo) * (X1 - X0);
  const rows = { watermarked: 190, clean: 320 };
  label(g, 172, rows.watermarked + 5, [['Distilled student']], { 'text-anchor': 'end', fill: C.blue, 'font-weight': 600, 'font-size': 14 });
  label(g, 172, rows.clean + 5, [['Clean student']], { 'text-anchor': 'end', fill: '#666', 'font-weight': 600, 'font-size': 14 });
  el('line', { x1: X0, y1: 400, x2: X1 + 14, y2: 400, stroke: '#9aa0a6', 'stroke-width': 1.2, 'marker-end': 'url(#arrow)' }, g);
  label(g, X1 + 14, 424, [['score: more watermark-like →']], { 'text-anchor': 'end', fill: C.muted, 'font-size': 13 });
  const r = rng(7), dots = [];
  for (const k of ['watermarked', 'clean'])
    DATA.scores[k].forEach(v => dots.push({ k, v, y: rows[k] + (r() - .5) * 74, order: r() }));
  dots.sort((a, b) => a.order - b.order);
  const dg = el('g', {}, g);
  dots.forEach(d => { d.node = el('circle', { cx: xs(d.v).toFixed(1), cy: d.y.toFixed(1), r: 2.6,
    fill: d.k === 'watermarked' ? C.blue : C.gray, opacity: 0 }, dg); });
  s.dots = dots;
  s.ex = el('g', {}, g);
  [['watermarked', C.blue], ['clean', C.gray]].forEach(([k, col]) => {
    const x = xs(DATA.step3.score[k]), y = rows[k];
    el('circle', { cx: x, cy: y, r: 7, fill: col, stroke: '#fff', 'stroke-width': 2 }, s.ex);
    el('circle', { cx: x, cy: y, r: 11, fill: 'none', stroke: col, 'stroke-width': 1.5 }, s.ex);
  });
  label(s.ex, xs(DATA.step3.score.watermarked) + 16, rows.watermarked - 44, [['the CO⁺ answers from the last step']], { 'font-size': 13, fill: C.ink });
  const tx = xs(DATA.threshold);
  s.thr = el('g', {}, g);
  el('line', { x1: tx, y1: 128, x2: tx, y2: 384, stroke: C.ink, 'stroke-width': 2, 'stroke-dasharray': '6 4' }, s.thr);
  label(s.thr, tx, 120, [['cutoff (set from clean teacher answers)']], { 'text-anchor': 'middle', 'font-size': 13 });
  s.cw = label(g, 800, rows.watermarked + 6, [['']], { 'font-size': 15, fill: C.blue, 'font-weight': 600 });
  s.cc = label(g, 800, rows.clean + 6, [['']], { 'font-size': 15, fill: '#666', 'font-weight': 600 });
  STEPS.push({
    name: 'All answers', title: 'Score every held-out answer', dur: 7, g,
    caption: `One dot per answer to 800 held-out prompts. Every answer from the distilled student lands right of the cutoff; ${DATA.flagged.clean} of 800 clean answers do.`,
    draw(t) {
      fade(s.ex, seg(t, 0, .1));
      const shown = Math.round(s.dots.length * ease(seg(t, .12, .7)));
      const thrOn = seg(t, .72, .82);
      let fw = 0, fc = 0;
      s.dots.forEach((d, i) => {
        const on = i < shown;
        d.node.setAttribute('opacity', on ? (thrOn > 0 && d.v <= DATA.threshold ? .45 : .75) : 0);
        if (on && d.v > DATA.threshold) d.k === 'watermarked' ? fw++ : fc++;
      });
      fade(s.thr, thrOn);
      const n = DATA.scores.watermarked.length;
      s.cw.lastChild.textContent = thrOn >= 1 ? `flagged ${fw}/${n}` : '';
      s.cc.lastChild.textContent = thrOn >= 1 ? `flagged ${fc}/${n}` : '';
    }
  });
})();

// ---------- player ----------
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const HOLD = 2.0;
let step = 0, start = performance.now(), playing = !reduce, pausedT = reduce ? 1 : 0;
const titleEl = document.getElementById('step-title'), capEl = document.getElementById('caption');
const playBtn = document.getElementById('play'), stepsEl = document.getElementById('steps');
STEPS.forEach((st, i) => {
  const b = document.createElement('button'); b.textContent = (i + 1) + '. ' + st.name;
  b.addEventListener('click', () => go(i, true)); stepsEl.appendChild(b); st.btn = b;
});
function show(i, t) {
  STEPS.forEach((st, k) => st.g.style.display = k === i ? '' : 'none');
  STEPS.forEach((st, k) => st.btn.setAttribute('aria-current', k === i ? 'step' : 'false'));
  titleEl.textContent = STEPS[i].title; capEl.innerHTML = STEPS[i].caption;
  STEPS[i].draw(clamp(t));
}
function go(i, user) {
  step = (i + STEPS.length) % STEPS.length; start = performance.now();
  pausedT = (user && !playing) || reduce ? 1 : 0;
  show(step, playing ? 0 : pausedT);
}
function setPlaying(p) {
  playing = p; playBtn.textContent = p ? '❚❚ Pause' : '▶ Play'; playBtn.setAttribute('aria-label', p ? 'Pause' : 'Play');
  if (p) { start = performance.now() - pausedT * STEPS[step].dur * 1000; }
}
playBtn.addEventListener('click', () => {
  if (playing) { pausedT = clamp((performance.now() - start) / (STEPS[step].dur * 1000)); setPlaying(false); }
  else { if (pausedT >= 1) go(step + 1); pausedT = pausedT >= 1 ? 0 : pausedT; setPlaying(true); }
});
document.getElementById('prev').addEventListener('click', () => go(step - 1, true));
document.getElementById('next').addEventListener('click', () => go(step + 1, true));
function frame(now) {
  if (playing) {
    const el_ = (now - start) / 1000, d = STEPS[step].dur;
    show(step, el_ / d);
    if (el_ > d + HOLD) go(step + 1);
  }
  requestAnimationFrame(frame);
}
setPlaying(playing); show(0, pausedT); requestAnimationFrame(frame);
window.__show = (i, t) => { playing = false; step = i; show(i, t); };   // for static previews and tests
// Tell the embedding page how tall this animation is, so its iframe never clips the controls.
function postHeight() { try { parent.postMessage({ type: 'anim-height', h: document.documentElement.scrollHeight }, '*'); } catch (e) {} }
addEventListener('load', postHeight); addEventListener('resize', postHeight); setTimeout(postHeight, 300);
</script>
