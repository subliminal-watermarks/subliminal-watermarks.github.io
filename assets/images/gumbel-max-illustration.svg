<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6a737d"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="920" height="400" fill="#ffffff"/>

  <!-- Step labels -->
  <text x="30" y="34" font-size="15" font-weight="600" fill="#1c1e21">1. Hash the context</text>
  <text x="300" y="34" font-size="15" font-weight="600" fill="#1c1e21">2. One random number per candidate</text>
  <text x="700" y="34" font-size="15" font-weight="600" fill="#1c1e21">3. Emit the winner</text>

  <!-- Step 1: context + key -> seed -->
  <text x="30" y="70" font-size="13" fill="#6a737d">previous 3 tokens</text>
  <rect x="30" y="80" width="200" height="40" rx="8" fill="#f6f8fa" stroke="#e1e4e8"/>
  <text x="130" y="106" font-size="16" fill="#1c1e21" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace">the answer is</text>
  <text x="130" y="146" font-size="18" fill="#6a737d" text-anchor="middle">+</text>
  <text x="30" y="166" font-size="13" fill="#6a737d">secret key</text>
  <rect x="30" y="176" width="200" height="40" rx="8" fill="#fff8e1" stroke="#f5c542"/>
  <text x="130" y="202" font-size="16" fill="#1c1e21" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace">k</text>
  <line x1="130" y1="222" x2="130" y2="262" stroke="#6a737d" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="142" y="247" font-size="13" fill="#6a737d">hash</text>
  <rect x="30" y="268" width="200" height="40" rx="8" fill="#f6f8fa" stroke="#e1e4e8"/>
  <text x="130" y="294" font-size="15" fill="#1c1e21" text-anchor="middle">seed</text>
  <line x1="236" y1="288" x2="292" y2="200" stroke="#6a737d" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 2: table -->
  <rect x="300" y="52" width="370" height="236" rx="8" fill="#ffffff" stroke="#e1e4e8"/>
  <text x="330" y="80" font-size="13" fill="#6a737d">token</text>
  <text x="430" y="80" font-size="13" fill="#6a737d" text-anchor="middle">model p</text>
  <text x="520" y="80" font-size="13" fill="#6a737d" text-anchor="middle">random u</text>
  <text x="615" y="80" font-size="13" fill="#6a737d" text-anchor="middle">u<tspan dy="-6" font-size="10">1/p</tspan></text>
  <line x1="315" y1="92" x2="655" y2="92" stroke="#e1e4e8"/>

  <g font-size="16" fill="#1c1e21">
    <text x="330" y="124" font-family="SFMono-Regular, Menlo, Consolas, monospace">4</text>
    <text x="430" y="124" text-anchor="middle">0.50</text>
    <text x="520" y="124" text-anchor="middle">0.30</text>
    <text x="615" y="124" text-anchor="middle">0.09</text>

    <rect x="312" y="139" width="346" height="34" rx="6" fill="#e6f1f8" stroke="#1477AC"/>
    <text x="330" y="162" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="700" fill="#1477AC">four</text>
    <text x="430" y="162" text-anchor="middle">0.30</text>
    <text x="520" y="162" text-anchor="middle" font-weight="700" fill="#1477AC">0.91</text>
    <text x="615" y="162" text-anchor="middle" font-weight="700" fill="#1477AC">0.73</text>

    <text x="330" y="202" font-family="SFMono-Regular, Menlo, Consolas, monospace">2</text>
    <text x="430" y="202" text-anchor="middle">0.15</text>
    <text x="520" y="202" text-anchor="middle">0.62</text>
    <text x="615" y="202" text-anchor="middle">0.04</text>

    <text x="330" y="240" font-family="SFMono-Regular, Menlo, Consolas, monospace">not</text>
    <text x="430" y="240" text-anchor="middle">0.05</text>
    <text x="520" y="240" text-anchor="middle">0.95</text>
    <text x="615" y="240" text-anchor="middle">0.36</text>
  </g>
  <text x="330" y="274" font-size="13" fill="#6a737d">…one u per token in the vocabulary</text>

  <!-- Step 3 -->
  <line x1="676" y1="156" x2="716" y2="156" stroke="#1477AC" stroke-width="1.8" marker-end="url(#arr)"/>
  <rect x="722" y="126" width="168" height="60" rx="10" fill="#e6f1f8" stroke="#1477AC" stroke-width="1.5"/>
  <text x="806" y="164" font-size="22" font-weight="700" fill="#1477AC" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace">four</text>
  <text x="700" y="214" font-size="13" fill="#1c1e21">Not the most likely token:</text>
  <text x="700" y="232" font-size="13" fill="#1c1e21">its large u won the fork.</text>

  <!-- Bottom: detection -->
  <rect x="30" y="322" width="860" height="58" rx="8" fill="#f6f8fa" stroke="#e1e4e8"/>
  <text x="48" y="346" font-size="14" fill="#1c1e21"><tspan font-weight="600">Detection (needs the key):</tspan> recompute u for every emitted token. Without the watermark, these u are uniform on (0, 1).</text>
  <text x="48" y="368" font-size="14" fill="#1c1e21">With it, emitted tokens have suspiciously large u, like the 0.91 here.</text>
</svg>
