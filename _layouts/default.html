<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% if page.title %}<title>{{ page.title }}</title>{% else %}<title>{{ site.title }}</title>{% endif %}
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
  <link rel="stylesheet" href="{{ '/assets/css/publication.css' | relative_url }}">
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true,
        tags: 'ams'   // numbers equations that have \label{...}; reference them with \eqref{...}
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body id="top">
  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <p>&copy; {{ 'now' | date: "%Y" }} The authors</p>
    <p class="template-credit">Layout inspired by <a href="https://aakaran.github.io/finetuning_with_sampling/">Finetuning with Sampling</a> and <a href="https://nerfies.github.io/">Nerfies</a>.</p>
  </footer>
  <script>
    // Size each embedded animation to its content; the animation posts its own height.
    addEventListener('message', function (e) {
      if (!e.data || e.data.type !== 'anim-height') return;
      document.querySelectorAll('.anim-embed iframe').forEach(function (f) {
        if (f.contentWindow === e.source) f.style.height = e.data.h + 'px';
      });
    });
    // A link into the collapsed "Experimental details" box opens the box first, then scrolls to the target.
    function openDetailsFor(hash) {
      if (!hash || hash.length < 2) return;
      var t = document.getElementById(decodeURIComponent(hash.slice(1)));
      var d = t && t.closest('details');
      if (d && !d.open) { d.open = true; t.scrollIntoView(); }
    }
    addEventListener('hashchange', function () { openDetailsFor(location.hash); });
    addEventListener('DOMContentLoaded', function () { openDetailsFor(location.hash); });
    document.addEventListener('click', function (e) {
      var a = e.target.closest && e.target.closest('a[href^="#"]');
      if (a) setTimeout(function () { openDetailsFor(a.getAttribute('href')); }, 0);
    });
  </script>
</body>
</html>
