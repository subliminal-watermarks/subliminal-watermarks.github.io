<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% if page.title %}<title>{{ page.title }}</title>{% else %}<title>{{ site.title }}</title>{% endif %}
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
  <link rel="stylesheet" href="{{ '/assets/css/publication.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true,
        tags: 'ams'   // numbers equations that have \label{...}; reference them with \eqref{...}
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body id="top">
  <a class="skip-link" href="#article-content">Skip to article</a>
  <main id="article-content">
    {{ content }}
    <footer class="site-footer">
      <p>&copy; {{ 'now' | date: "%Y" }} The authors</p>
      <p class="template-credit">Style inspired by <a href="https://arnav0400.github.io/subspace-tuning-emergent-misalignment/">Subspace Tuning</a>.</p>
    </footer>
  </main>
  <script defer src="{{ '/assets/js/demos.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
</body>
</html>
